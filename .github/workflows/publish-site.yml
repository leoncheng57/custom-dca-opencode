name: Publish public website

on:
  push:
    branches: [main]
    paths:
      - agent-skills/**
      - scripts/public-site.ts
      - scripts/stage-public-site.ts
      - package.json
      - package-lock.json
      - .github/workflows/publish-site.yml
  workflow_dispatch:

# The site and screenshot publishers share gh-pages and must never race.
concurrency:
  group: pr-screenshot-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build public website
        working-directory: source
        run: npm run build:site

      - name: Check out shared Pages branch
        run: |
          git clone --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          cd pages
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git switch --track origin/gh-pages
          else
            git switch --orphan gh-pages
            git rm -rf . || true
          fi

      - name: Stage only website-owned paths
        run: |
          cd source
          npx tsx scripts/stage-public-site.ts \
            --build agent-skills/dist \
            --destination ../pages

      - name: Publish website
        working-directory: pages
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish public website at $SOURCE_SHA"
          git push origin gh-pages
