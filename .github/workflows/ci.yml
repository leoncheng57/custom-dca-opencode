name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref; cancel superseded runs on a busy PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cheapest tiers first — a type error should not wait on a build.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # e2e runs against a mock OpenCode server (tests/e2e/mock-opencode.ts),
      # so CI needs no agent, no API keys and no network.
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # This repo is public and talks to a server that runs shell commands on the
  # host. A leaked token is a direct path to code execution, so scan every PR.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
