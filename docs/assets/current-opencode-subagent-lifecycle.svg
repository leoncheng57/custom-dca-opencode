<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Current OpenCode sub-agent lifecycle</title>
  <desc id="desc">A parent invokes Task, OpenCode creates a child session, foreground or background execution proceeds, and the BFF combines four evidence sources into a derived browser ledger.</desc>
  <defs>
    <style>
      .bg{fill:#f3f4f6}.surface{fill:#fff}.line{stroke:#d1d5db;stroke-width:1.5}.text{fill:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#6b7280;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:19px;font-weight:700}.body{font-size:13px}.small{font-size:11px}.blue-bg{fill:#eff6ff}.blue{fill:#1d4ed8}.green-bg{fill:#ecfdf5}.green{fill:#15803d}.amber-bg{fill:#fffbeb}.amber{fill:#b45309}.action{fill:#16a34a}.white{fill:#fff}.arrow{stroke:#16a34a;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6b7280;stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#gray)}
      .stage{opacity:.35;animation:focus 10s infinite}.s1{animation-delay:0s}.s2{animation-delay:2s}.s3{animation-delay:4s}.s4{animation-delay:6s}.s5{animation-delay:8s}@keyframes focus{0%,19%{opacity:1;transform:translateY(-4px)}20%,100%{opacity:.35;transform:none}}
      @media(prefers-reduced-motion:reduce){.stage{animation:none!important;opacity:1!important;transform:none!important}}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#16a34a"/></marker>
    <marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6b7280"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111827" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="540" class="bg"/>
  <text x="40" y="40" class="text h">Current OpenCode sub-agent lifecycle</text>
  <text x="40" y="63" class="muted body">OpenCode executes child sessions; the BFF reconstructs an evidence-labelled view.</text>

  <g class="stage s1" transform="translate(40 105)" filter="url(#shadow)">
    <rect width="190" height="150" rx="13" class="surface line"/>
    <text x="16" y="26" class="muted small">1 · PARENT TURN</text>
    <text x="16" y="53" class="text h">Task invocation</text>
    <text x="16" y="82" class="text body">subagent_type</text><text x="16" y="104" class="text body">prompt + description</text><text x="16" y="126" class="text body">background?</text>
  </g>
  <path d="M240 180H275" class="arrow"/>

  <g class="stage s2" transform="translate(285 105)" filter="url(#shadow)">
    <rect width="200" height="150" rx="13" class="blue-bg line"/>
    <text x="16" y="26" class="blue small">2 · OPENCODE</text>
    <text x="16" y="53" class="text h">Child session</text>
    <text x="16" y="82" class="text body">id = stable child key</text><text x="16" y="104" class="text body">parentID = parent</text><text x="16" y="126" class="text body">separate transcript/tools</text>
  </g>
  <path d="M495 180H530" class="arrow"/>

  <g class="stage s3" transform="translate(540 88)" filter="url(#shadow)">
    <rect width="205" height="184" rx="13" class="surface line"/>
    <text x="16" y="27" class="muted small">3 · EXECUTION MODE</text>
    <rect x="14" y="46" width="177" height="53" rx="8" class="green-bg line"/><text x="26" y="67" class="green small">FOREGROUND</text><text x="26" y="88" class="text body">Parent waits for result</text>
    <rect x="14" y="113" width="177" height="55" rx="8" class="amber-bg line"/><text x="26" y="134" class="amber small">BACKGROUND</text><text x="26" y="155" class="text body">Launch returns; child continues</text>
  </g>
  <path d="M755 180H790" class="arrow"/>

  <g class="stage s4" transform="translate(800 88)" filter="url(#shadow)">
    <rect width="190" height="184" rx="13" class="surface line"/>
    <text x="15" y="27" class="muted small">4 · BFF EVIDENCE</text>
    <text x="15" y="57" class="text body">children relationship</text><text x="15" y="82" class="text body">parent Task parts</text><text x="15" y="107" class="text body">process status</text><text x="15" y="132" class="text body">child transcript</text><text x="15" y="157" class="text body">parent hand-back</text>
  </g>
  <path d="M1000 180H1035" class="arrow"/>

  <g class="stage s5" transform="translate(1045 105)" filter="url(#shadow)">
    <rect width="115" height="150" rx="13" class="surface line"/>
    <text x="12" y="26" class="muted small">5 · UI</text>
    <text x="12" y="54" class="green small">running</text><text x="12" y="77" class="blue small">completed</text><text x="12" y="100" class="text body">failed</text><text x="12" y="123" class="amber small">unknown</text>
  </g>

  <g transform="translate(40 320)">
    <rect width="1120" height="165" rx="14" class="surface line"/>
    <text x="18" y="29" class="text h">The load-bearing distinction</text>
    <rect x="18" y="48" width="337" height="91" rx="9" class="green-bg line"/><text x="34" y="72" class="green small">FOREGROUND COMPLETED TASK PART</text><text x="34" y="98" class="text body">Supported as child completion because</text><text x="34" y="119" class="text body">the parent Task call waited.</text>
    <rect x="391" y="48" width="337" height="91" rx="9" class="amber-bg line"/><text x="407" y="72" class="amber small">BACKGROUND COMPLETED TASK PART</text><text x="407" y="98" class="text body">Only the launch call returned.</text><text x="407" y="119" class="text body">Child outcome remains unproven.</text>
    <rect x="764" y="48" width="338" height="91" rx="9" class="blue-bg line"/><text x="780" y="72" class="blue small">STATUS ABSENT</text><text x="780" y="98" class="text body">Not owned by this process.</text><text x="780" y="119" class="text body">Never infer idle or completed.</text>
  </g>
  <text x="40" y="520" class="muted small">Unknown is not a failure of the UI. It is the correct result when durable terminal evidence does not exist.</text>
</svg>
